# git tag v0.2.0 && git push --tags: image to ghcr, package to PyPI, then a GitHub release. See RELEASING.md.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cobanov/runyard
          tags: type=semver,pattern={{version}}  # v0.2.0 -> 0.2.0; latest is added for non-prerelease tags
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { contents: read, id-token: write }  # trusted publishing, no token
    steps:
      - uses: actions/checkout@v4
      - name: version from the tag (pyproject reads it from runyard/__init__.py)
        working-directory: sdk/python
        run: sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" runyard/__init__.py && grep -n __version__ runyard/__init__.py
      - name: sdist and wheel
        run: pipx run build sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: sdk/python/dist/ }

  release:
    needs: [image, pypi]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
