[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runyard"
dynamic = ["version"]  # runyard/__init__.py; release.yml sets it from the tag
description = "Python client for runyard, a lightweight self-hosted training tracker"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
images = ["numpy", "pillow"]
system = ["nvidia-ml-py", "psutil"]
video = ["imageio", "imageio-ffmpeg"]
tensorboard = ["tensorboard"]
dev = ["pytest", "numpy", "pillow"]

[project.scripts]
runyard = "runyard.cli:main"

[project.urls]
Homepage = "https://github.com/cobanov/runyard"

[tool.hatch.version]
path = "runyard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["runyard"]

# RUNYARD_WANDB=1 turns `import wandb` into runyard (runyard/wandb_hook.py)
[tool.hatch.build.targets.wheel.force-include]
"runyard_wandb.pth" = "runyard_wandb.pth"
