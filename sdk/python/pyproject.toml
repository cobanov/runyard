[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runyard"
version = "0.1.0.dev0"
description = "Python client for runyard, a lightweight self-hosted training tracker"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
images = ["numpy", "pillow"]
system = ["nvidia-ml-py", "psutil"]
dev = ["pytest"]

[project.scripts]
runyard = "runyard.cli:main"

[project.urls]
Homepage = "https://github.com/cobanov/runyard"
