name: Runyard
options:
  bundleIdPrefix: dev.cobanov
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6U58AKY6F8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Runyard:
    type: application
    platform: iOS
    sources: [Runyard]
    scheme:
      testTargets: [RunyardTests, RunyardUITests]
    info:
      path: Runyard/Info.plist
      properties:
        CFBundleDisplayName: runyard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # App Store Connect rejects a bundle without this key; these are the iPhone defaults the app already had.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Self-hosted servers are often plain http on a LAN or tailnet address, as with Jellyfin.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: runyard connects to your training server on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.runyard
        PRODUCT_NAME: Runyard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RunyardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Runyard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.runyard.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  RunyardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Runyard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.runyard.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
