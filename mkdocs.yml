site_name: runyard
site_description: A lightweight, self-hosted training tracker
site_url: https://cobanov.github.io/runyard/
repo_url: https://github.com/cobanov/runyard
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: { text: Atkinson Hyperlegible Next, code: Atkinson Hyperlegible Mono }
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [content.code.copy, navigation.sections]
extra_css: [stylesheets/extra.css]
markdown_extensions: [admonition, tables, toc: { permalink: true }, pymdownx.highlight, pymdownx.superfences]
nav:
  - Home: index.md
  - Run the server: server.md
  - Log runs: logging.md
  - Read runs: reading.md
  - Notifications and checks: notifications.md
  - Coding agents: agents.md
