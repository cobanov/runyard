site_name: runyard
site_description: A lightweight, self-hosted training tracker
site_url: https://cobanov.github.io/runyard/
repo_url: https://github.com/cobanov/runyard
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [content.code.copy, navigation.sections]
markdown_extensions: [admonition, tables, toc: { permalink: true }, pymdownx.highlight, pymdownx.superfences]
nav:
  - Home: index.md
  - Run the server: server.md
  - Log runs: logging.md
  - Read runs: reading.md
  - Notifications and checks: notifications.md
