# docker compose up -d                then open http://localhost:8080 (the released image; --build builds this checkout)
# API key for training scripts:       the Settings page makes the first one, or
#                                     docker compose exec app /runyard-server key create <name>
# Phone notifications:                docker compose exec app /runyard-server channel add ...  (see README)
# Backup: pg_dump of the db service plus the media volume.
services:
  app:
    image: ghcr.io/cobanov/runyard:${RUNYARD_VERSION:-latest}  # pin a version to upgrade when you choose to
    build: .
    restart: unless-stopped
    # needs 0.7.0 or newer: an older image has no `health` and shows as unhealthy while working
    healthcheck: { test: ["CMD", "/runyard-server", "health"], interval: 10s, timeout: 3s, retries: 6, start_period: 60s }
    environment:
      DATABASE_URL: postgres://runyard:${POSTGRES_PASSWORD:-runyard}@db/runyard?sslmode=disable
      RUNYARD_URL: ${RUNYARD_URL:-}  # public address, used for links in notifications
      RUNYARD_AUTH: ${RUNYARD_AUTH:-}  # 1: reads need a login or key, teams see their own projects (README)
      # media and artifacts in an S3-compatible bucket (Cloudflare R2, S3, ...) instead of the media volume
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}   # R2: https://<account id>.r2.cloudflarestorage.com
      S3_REGION: ${S3_REGION:-auto}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: ["media:/media"]
    # without RUNYARD_AUTH reads need no key, so by default only this machine (or tailscale serve / a tunnel) reaches it
    ports: ["${RUNYARD_BIND:-127.0.0.1:8080}:8080"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:17
    restart: unless-stopped
    # the password only matters on the first start, when the database is made; it is never published outside this network
    environment: { POSTGRES_USER: runyard, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-runyard}", POSTGRES_DB: runyard }
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "runyard"], interval: 2s, timeout: 5s, retries: 30 }

volumes:
  media:
  pg:
